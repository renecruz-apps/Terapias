<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terapias – Neuromuscular Care</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Terapias">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#f4f8fb;overflow:hidden}
  iframe{display:block;border:0;width:100%;height:100vh;height:100dvh}
</style>
</head>
<body>
<iframe id="app" title="Lançamento de terapias" allow="clipboard-write"></iframe>
<script>
  // abre o app; se o link tiver ?fa=código (assinatura da família), repassa o código para a página de assinatura
  var APP = 'https://script.google.com/macros/s/AKfycby_yfo5i_knwoKzHqwTaoVBK4jHT1uu-PBFczW3OOj_xkUTFQ-z5DWaEcqZ08DDvVhI/exec';
  var fa = (new URLSearchParams(location.search).get('fa') || '').replace(/[^a-fA-F0-9]/g, '');
  if (fa) document.title = 'Assinatura – Neuromuscular Care';
  document.getElementById('app').src = APP + (fa ? '?fa=' + fa : '');
</script>
</body>
</html>
